services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_dashboard
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5433:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics_dashboard"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  analytics_postgres_data:
